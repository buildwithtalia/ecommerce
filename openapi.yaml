442│components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Product:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
        stock:
          type: integer
        category:
          type: string
        created_at:
          type: string
          format: date-time
      required: [id, name, price, stock, created_at]
    ProductCreate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
          minimum: 0
        stock:
          type: integer
          default: 0
        category:
          type: string
      required: [name, price]
    ProductUpdate:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        price:
          type: number
          format: float
          minimum: 0
        stock:
          type: integer
        category:
          type: string
    Order:
      type: object
      properties:
        id:
          type: integer
        customer_name:
          type: string
        customer_email:
          type: string
          format: email
        product_id:
          type: integer
        product_name:
          type: string
          nullable: true
        quantity:
          type: integer
          minimum: 1
        total_price:
          type: number
          format: float
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
        created_at:
          type: string
          format: date-time
      required: [id, customer_name, product_id, quantity, total_price, status, created_at]
    OrderCreate:
      type: object
      properties:
        customer_name:
          type: string
        customer_email:
          type: string
          format: email
        product_id:
          type: integer
        quantity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
          default: pending
      required: [customer_name, product_id, quantity]
    OrderUpdate:
      type: object
      properties:
        customer_name:
          type: string
        customer_email:
          type: string
          format: email
        quantity:
          type: integer
          minimum: 1
        status:
          type: string
          enum: [pending, confirmed, shipped, delivered, cancelled]
