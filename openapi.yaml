openapi: 3.1.0
info:
  title: E-commerce API
  version: 1.0.0
  description: |
    OpenAPI 3.1 specification generated from Flask application routes in app.py.
    This API manages products and orders for a simple e-commerce system.
servers:
  - url: http://localhost:5001
paths:
  /:
    get:
      summary: Root endpoint with API information
      operationId: getRoot
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: E-commerce API
                  version:
                    type: string
                    example: 1.0.0
                  endpoints:
                    type: object
      tags: [System]
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X GET http://localhost:5001/
  /health:
    get:
      summary: Health check
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: healthy
                  message:
                    type: string
                    example: E-commerce API is running
      tags: [System]
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X GET http://localhost:5001/health
  /products:
    get:
      summary: Get all products
      description: Get all products with optional filtering by category and price range.
      operationId: listProducts
      parameters:
        - in: query
          name: category
          schema:
            type: string
          description: Filter by category
        - in: query
          name: min_price
          schema:
            type: number
            format: float
          description: Minimum price filter
        - in: query
          name: max_price
          schema:
            type: number
            format: float
          description: Maximum price filter
      responses:
        "200":
          description: A list of products
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
      tags: [Products]
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -G http://localhost:5001/products \
              --data-urlencode "category=electronics" \
              --data-urlencode "min_price=10" \
              --data-urlencode "max_price=1000"
    post:
      summary: Create a new product
      operationId: createProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductCreate'
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags: [Products]
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST http://localhost:5001/products \
              -H "Content-Type: application/json" \
              -d '{"name":"Keyboard","description":"Mechanical","price":79.99,"stock":25,"category":"accessories"}'
  /products/{product_id}:
    parameters:
      - in: path
        name: product_id
        required: true
        schema:
          type: integer
    get:
      summary: Get product by ID
      operationId: getProduct
      responses:
        "200":
          description: Product details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags: [Products]
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X GET http://localhost:5001/products/1
    put:
      summary: Update a product
      operationId: updateProduct
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProductUpdate'
      responses:
        "200":
          description: Updated product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags: [Products]
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X PUT http://localhost:5001/products/1 \
              -H "Content-Type: application/json" \
              -d '{"price":74.99,"stock":30}'
    delete:
      summary: Delete a product
      operationId: deleteProduct
      responses:
        "200":
          description: Product deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Product deleted successfully
        "400":
          description: Cannot delete product with existing orders
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags: [Products]
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X DELETE http://localhost:5001/products/1
  /orders:
    get:
      summary: Get all orders
      description: Get all orders with optional filtering by status and customer email.
      operationId: listOrders
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [pending, confirmed, shipped, delivered, cancelled]
          description: Filter by order status
        - in: query
          name: customer_email
          schema:
            type: string
            format: email
          description: Filter by customer email
      responses:
        "200":
          description: A list of orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Order'
      tags: [Orders]
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -G http://localhost:5001/orders \
              --data-urlencode "status=pending" \
              --data-urlencode "customer_email=alice@example.com"
    post:
      summary: Create a new order
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderCreate'
      responses:
        "201":
          description: Order created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags: [Orders]
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X POST http://localhost:5001/orders \
              -H "Content-Type: application/json" \
              -d '{"customer_name":"Alice","customer_email":"alice@example.com","product_id":2,"quantity":1,"status":"pending"}'
  /orders/{order_id}:
    parameters:
      - in: path
        name: order_id
        required: true
        schema:
          type: integer
    get:
      summary: Get order by ID
      operationId: getOrder
      responses:
        "200":
          description: Order details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags: [Orders]
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X GET http://localhost:5001/orders/1
    put:
      summary: Update an order
      operationId: updateOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrderUpdate'
      responses:
        "200":
          description: Updated order
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Order'
        "400":
          description: Validation error or insufficient stock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags: [Orders]
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
            curl -X PUT http://localhost:5001/orders/1 \
              -H "Content-Type: application/json" \
              -d '{"status":"confirmed","quantity":2,"customer_email":"alice+confirmed@example.com"}'
    delete:
      summary: Delete an order
      operationId: deleteOrder
      responses:
        "200":
          description: Order deleted
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Order deleted successfully
        "404":
          description: Order not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      tags: [Orders]
      x-codeSamples:
        - lang: curl
          label: cURL
          source: |
